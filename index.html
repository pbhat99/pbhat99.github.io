<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prasannakumar T Bhat</title>
  <meta name="description" content="Prasannakumar T Bhat - Visual Effects Compositor">
  <link rel="icon" type="image/png" href="_engine/images/logo.png">
  
  <!-- Ubuntu Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Ubuntu:ital,wght@0,300;0,400;0,500;0,700;1,300;1,400;1,700&family=Ubuntu+Mono:wght@400;700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="_engine/css/main.css">
  <link rel="stylesheet" href="_engine/css/components.css">
  <link rel="stylesheet" href="_engine/css/responsive.css">
  
  <style>
    /* Full-Page Fixed Non-Scrollable Viewport */
    html, body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      position: fixed;
      inset: 0;
      background-color: var(--bg-primary);
      font-family: 'Ubuntu', sans-serif;
    }

    /* Seamless Navigation: No borders, no lines, no background */
    .site-header {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      z-index: 100;
      background: transparent !important;
      border: none !important;
      box-shadow: none !important;
    }

    .home-fullscreen-container {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding-inline: 24px;
      background-color: var(--bg-primary);
      overflow: hidden;
    }

    /* Non-stretching, automatic proportional fit */
    .home-bg-image {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      background-size: cover;
      background-position: center center;
      background-repeat: no-repeat;
      z-index: 0;
      pointer-events: none;
    }

    /* Controlled Overlay Layer: opacity 0 = full image, 100 = solid background */
    .home-bg-overlay {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      background-color: var(--bg-primary);
      z-index: 1;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    #bg-canvas {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 2;
    }

    /* Center Stage: Stacked 3 Lines, Perfectly Centered */
    .home-center-stage {
      position: relative;
      z-index: 10;
      max-width: 900px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      gap: 16px;
    }

    /* 1st Line: Fixed Name */
    .hero-name-main {
      font-family: 'Ubuntu', sans-serif;
      font-size: clamp(2.4rem, 5.5vw, 4.4rem);
      font-weight: 700;
      color: var(--text-main);
      letter-spacing: -0.02em;
      line-height: 1.1;
      margin: 0;
      text-shadow: 0 0 45px rgba(249, 134, 3, 0.25);
    }

    /* 2nd Line: Designation (Pure text, no box or outline) */
    .hero-designation-plain {
      font-family: 'Ubuntu', sans-serif;
      font-size: clamp(1.05rem, 2vw, 1.45rem);
      font-weight: 500;
      color: var(--accent-primary);
      letter-spacing: 0.05em;
      margin: 0;
      line-height: 1.3;
    }

    /* 3rd Line: Tagline (Pure text, off-white italic) */
    .hero-tagline-plain {
      font-family: 'Ubuntu', sans-serif;
      font-size: clamp(0.95rem, 1.6vw, 1.25rem);
      font-weight: 400;
      font-style: italic;
      color: var(--text-muted);
      max-width: 740px;
      margin: 0;
      line-height: 1.5;
    }

    .hero-about-wrap {
      margin-top: 24px;
    }

    .btn-about {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 11px 40px;
      font-size: 0.95rem;
      font-weight: 500;
      font-family: 'Ubuntu', sans-serif;
      border-radius: var(--radius-full);
      background: var(--accent-primary);
      color: #ffffff;
      box-shadow: 0 4px 18px rgba(249, 134, 3, 0.4);
      transition: all var(--transition-fast);
      letter-spacing: 0.02em;
    }

    .btn-about:hover {
      background: var(--accent-hover);
      transform: translateY(-2px);
      box-shadow: 0 6px 25px rgba(249, 134, 3, 0.55);
    }
  </style>
</head>
<body>

  <header class="site-header">
    <div class="container-wide nav-wrapper">
      <a href="index.html" class="brand-logo">
        <img src="_engine/images/logo.png" alt="Pra Motions Logo" width="34" height="34" style="border-radius: 6px;">
        <span>Pra - <span class="brand-badge">Motions</span></span>
      </a>

      <button class="mobile-nav-toggle" aria-label="Toggle navigation" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>

      <ul class="nav-links">
        <li><a href="index.html" class="active">Home</a></li><li><a href="vfx-works.html">VFX Works</a></li><li><a href="ai-comfy.html">AI / Comfy</a></li><li><a href="photography.html">Photography</a></li><li><a href="about-me.html">About Me</a></li><li><a href="blog.html">Blog</a></li>
      </ul>
    </div>
  </header>

  <!-- Full-Screen Interactive Viewport -->
  <main class="home-fullscreen-container">
    <div class="home-bg-image" style="background-image: url('pages/01_home/background.jpg');"></div>
    <div class="home-bg-overlay" style="opacity: 0.55;"></div>

    <!-- Interactive Canvas Background -->
    <canvas id="bg-canvas"></canvas>

    <!-- Center Stage: 3 Lines Centered + About Button -->
    <div class="home-center-stage">
      <h1 class="hero-name-main">Prasannakumar T Bhat</h1>
      <p class="hero-designation-plain">Visual Effects Compositor</p>
      <p class="hero-tagline-plain">"CG is not just faking, its adding beautiful layers of lie on the ugly truth."</p>

      <div class="hero-about-wrap">
        <a href="about-me.html" class="btn-about">About</a>
      </div>
    </div>
  </main>

  <script type="module">
    import { initInteractiveBackground } from './_engine/js/interactive-bg.js';
    import './_engine/js/main.js';
    initInteractiveBackground('bg-canvas');

    // Live sync overlay opacity if content.json is edited
    fetch('pages/01_home/content.json')
      .then(r => r.json())
      .then(d => {
        const raw = d.overlayOpacity ?? d.bgOverlayOpacity ?? d.opacity;
        if (raw !== undefined) {
          let num = parseFloat(raw);
          if (num > 1) num = num / 100;
          const overlay = document.querySelector('.home-bg-overlay');
          if (overlay) overlay.style.opacity = Math.max(0, Math.min(1, num));
        }
      }).catch(() => {});
  </script>
</body>
</html>
